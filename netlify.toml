[build]
  functions = "netlify/functions"
  publish = "."
  command = "npm install"

[functions]
  node_bundler = "esbuild"

# Friendly URLs for the admin API, so the frontend code never has to
# know about the underlying /.netlify/functions/ path.
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/content"
  to = "/.netlify/functions/content"
  status = 200

[[redirects]]
  from = "/api/image"
  to = "/.netlify/functions/image"
  status = 200

# The kiosk (touch-screen) app lives at /kiosk; the public website is the root index.html.
# A rewrite (not a redirect) keeps the URL as /kiosk so the app's relative asset paths still resolve.
[[redirects]]
  from = "/kiosk"
  to = "/kiosk.html"
  status = 200

[[redirects]]
  from = "/kiosk/"
  to = "/kiosk"
  status = 301
