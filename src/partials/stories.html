<section class="section alt" id="testimonials" hidden>
  <div class="wrap">
    <header class="sec-head reveal">
      <span class="kicker" data-i18n="p_kicker">Patient Testimonials</span>
      <h2 class="h2" data-i18n-html="p_title">Real stories, <em>in patients' own words</em></h2>
    </header>
    <div class="carousel reveal" id="testiCarousel">
      <button class="car-btn prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>

    </div>
    <div id="reviewsBlock" hidden>
      <h3 class="sub-h" data-i18n="r_title">What patients are saying</h3>
      <div class="carousel reveal" id="revCarousel">
        <button class="car-btn prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="car-track" id="revTrack"></div>
        <button class="car-btn next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
  </div>
</section>
