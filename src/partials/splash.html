<!-- ============ SPLASH / INTRO SCREEN (same as the kiosk app) ============ -->
<div class="splash" id="splashScreen" role="dialog" aria-label="Welcome">
  <div class="splash-stage-wrapper">
    <div class="splash-stage-spacer"></div>
    <div class="splash-stage">
      <img class="splash-bg-img" data-img-src="splashbg" src="/images/splash-bg.png" alt="">
      <div class="splash-ring"></div>
      <div class="splash-orbit-wrap o1"><div class="dot"></div></div>
      <div class="splash-orbit-wrap o2"><div class="dot"></div></div>
      <div class="splash-orbit-wrap o3"><div class="dot"></div></div>
      <div class="splash-orbit-wrap o4"><div class="dot"></div></div>
      <div class="splash-content">
        <img class="splash-logo-img" data-img-src="logo" src="/images/logo.png" alt="Clinic logo">
        <div class="splash-wordmark"><span class="w">IR</span><span class="g">@SABAH</span></div>
        <div class="splash-name">Dr. Chandran Nadarajan</div>
        <svg class="splash-heartbeat" viewBox="0 0 300 24" fill="none" stroke="#e9b949" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M0,12 H60 L68,12 L74,3 L80,21 L86,7 L91,12 L98,12 L105,4 L111,20 L117,9 L122,12 H150 L158,12 L164,3 L170,21 L176,7 L181,12 L188,12 L195,4 L201,20 L207,9 L212,12 H300"/>
        </svg>
        <div class="splash-role" data-i18n="role">Consultant Clinical &amp; Interventional Radiologist</div>
        <button class="splash-enter-btn" id="splashEnterBtn" data-i18n="enter">Enter</button>
      </div>
    </div>
  </div>
  <div class="splash-mobile-wrapper">
    <div class="splash-mobile-spacer"></div>
    <div class="splash-mobile-stage">
      <img class="splash-bg-img" data-img-src="splashbgmobile" src="/images/splash-bg-mobile.png" alt="">
      <div class="splash-orbit-wrap m o1"><div class="dot"></div></div>
      <div class="splash-orbit-wrap m o2"><div class="dot"></div></div>
      <div class="splash-orbit-wrap m o3"><div class="dot"></div></div>
      <div class="splash-orbit-wrap m o4"><div class="dot"></div></div>
      <div class="splash-content">
        <img class="splash-logo-img m" data-img-src="logo" src="/images/logo.png" alt="Clinic logo">
        <div class="splash-wordmark m"><span class="w">IR</span><span class="g">@SABAH</span></div>
        <div class="splash-name m">Dr. Chandran Nadarajan</div>
        <svg class="splash-heartbeat m" viewBox="0 0 300 24" fill="none" stroke="#e9b949" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M0,12 H60 L68,12 L74,3 L80,21 L86,7 L91,12 L98,12 L105,4 L111,20 L117,9 L122,12 H150 L158,12 L164,3 L170,21 L176,7 L181,12 L188,12 L195,4 L201,20 L207,9 L212,12 H300"/>
        </svg>
        <div class="splash-role m" data-i18n="role">Consultant Clinical &amp; Interventional Radiologist</div>
        <button class="splash-enter-btn m" data-i18n="enter">Enter</button>
        <div class="splash-tap-hint m" data-i18n="tap">Tap anywhere to begin</div>
      </div>
    </div>
  </div>
</div>
